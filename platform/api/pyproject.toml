[project]
name = "evalforge"
version = "0.1.0"
description = "LLM evaluation platform: multi-provider eval runs with pluggable judges"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]
postgres = ["asyncpg>=0.29"]
# Optional: the local DeBERTa hallucination judge (evalforge.judges.deberta_judge).
# Kept out of the base dependency set so the core async platform stays
# lightweight for users who only need the cloud judges / providers.
deberta = ["torch>=2.3", "transformers>=4.42"]
# Optional: the local preference reward judge (evalforge.judges.reward_judge).
# Same torch/transformers set as `deberta`, kept as a separate extra so
# consumers only pull in the judge(s) they actually use.
reward = ["torch>=2.3", "transformers>=4.42"]

[project.scripts]
evalforge = "evalforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12, not 3.11 (see requires-python above): once the optional `deberta`
# extra is installed, numpy's shipped .pyi stubs (a transitive dependency of
# torch/transformers) use PEP 695 `type` statement syntax, which mypy can
# only parse when its python_version target is 3.12+, regardless of the
# language version our own code targets. Same fix as training/pyproject.toml.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# torch/transformers are an optional extra (see [project.optional-dependencies]
# deberta) and won't be installed in every environment that runs mypy against
# this package (CI installs only [dev]); don't fail strict-mode checking on
# their missing stubs. Note: this must target torch/transformers themselves —
# an override on deberta_judge only affects importing *it*, not what it imports.
module = ["torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# deberta_judge carries a `type: ignore` that is needed when the deberta extra
# IS installed (transformers' .to() stub over-narrows) but reads as unused when
# it isn't (the import resolves to Any). Silence unused-ignore warnings for
# this one module so strict mypy passes in both worlds.
module = ["evalforge.judges.deberta_judge", "evalforge.judges.reward_judge"]
warn_unused_ignores = false
