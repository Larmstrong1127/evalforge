[project]
name = "evalforge-training"
version = "0.1.0"
description = "Fine-tunes a local hallucination-detection judge for EvalForge"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "transformers>=4.42",
    "datasets>=2.19",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
