[project]
name = "evalforge-training"
version = "0.1.0"
description = "Fine-tunes a local hallucination-detection judge for EvalForge"
requires-python = ">=3.11"
# GPU setup: a plain `pip install -e ".[dev]"` pulls the CPU-only torch wheel
# from PyPI and silently trains on CPU (extremely slow, and the CPU autocast
# path in this torch version has a real dtype bug under DebertaV2's
# LayerNorm). After installing, reinstall torch for your CUDA version:
#   pip install torch --index-url https://download.pytorch.org/whl/cu126 --upgrade
# Verify with: python -c "import torch; print(torch.cuda.is_available())"
dependencies = [
    "torch>=2.3",
    "transformers>=4.42",
    "datasets>=2.19",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One-off script with long markdown-table strings copied verbatim from the report.
"publish_to_hub.py" = ["E501"]

[tool.mypy]
# 3.12, not 3.11 (see requires-python above): numpy's shipped .pyi stubs use
# PEP 695 `type` statement syntax, which mypy can only parse when its
# python_version target is 3.12+, regardless of the language version our own
# code targets. This is a stub-parsing requirement, not a relaxation of the
# package's actual >=3.11 support.
python_version = "3.12"
ignore_missing_imports = true
